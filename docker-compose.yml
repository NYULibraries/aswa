services:

  aswa:
    image: aswa
    build: .
    # volumes:
    #   - ./config:/config
    environment:
      - ENV=${ENV:-dev}
      - DEBUG_MODE=${DEBUG_MODE:-false}
      - PROM_AGGREGATION_GATEWAY_URL=${PROM_AGGREGATION_GATEWAY_URL}
      - YAML_PATH=${YAML_PATH:-config/dev.applications.yml}

  test:
    image: aswa_test
    build:
      context: .
      dockerfile: Dockerfile.test
