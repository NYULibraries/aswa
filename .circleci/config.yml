docker-defaults: &docker-defaults
  docker:
    - image: cimg/base:2025.01
  working_directory: ~/app

version: 2.1

parameters:
  # Set by the weekly schedule trigger
  weekly-security-scan:
    type: boolean
    default: false

jobs:
  build-test:
    <<: *docker-defaults
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build test
          command: |
            docker compose build test
      - run:
          name: Check formatting
          command: |
            format_output=$(docker compose run test gofmt -l .)
            echo "$format_output"
            test -z "$format_output"
      - run:
          name: Test
          command: |
            docker compose run test
      - run:
          name: Check vulnerabilities
          command: |
            docker compose run test govulncheck ./...

  publish-image:
    <<: *docker-defaults
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build app
          command: |
            docker compose build aswa
      - run:
          name: Push image
          command: |
            export BRANCH_NO_SLASH=${CIRCLE_BRANCH//\//_}
            docker tag aswa quay.io/nyulibraries/aswa:${BRANCH_NO_SLASH}
            docker tag aswa quay.io/nyulibraries/aswa:${BRANCH_NO_SLASH}-${CIRCLE_SHA1}
            printf '%s' "$QUAY_PASSWORD" | docker login -u "$QUAY_USERNAME" --password-stdin quay.io
            docker push quay.io/nyulibraries/aswa:${BRANCH_NO_SLASH}
            docker push quay.io/nyulibraries/aswa:${BRANCH_NO_SLASH}-${CIRCLE_SHA1}

  security-scan:
    <<: *docker-defaults
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build test
          command: |
            docker compose build test
      - run:
          name: Check source vulnerabilities
          command: |
            docker compose run test govulncheck ./...
      - run:
          name: Check published image vulnerabilities
          command: |
            # Scan the binary inside the image the clusters run
            docker pull quay.io/nyulibraries/aswa:main
            docker create --name published quay.io/nyulibraries/aswa:main
            docker cp published:/aswa - | docker compose run -T test sh -c 'tar -xf - -C /tmp && govulncheck -mode binary /tmp/aswa'
      - run:
          name: Post failure to Slack
          when: on_fail
          command: |
            text="aswa weekly security scan failed on ${CIRCLE_BRANCH}: ${CIRCLE_BUILD_URL}"
            jq -n --arg text "$text" '{text: $text}' |
              curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' -d @- "$SECURITY_SCAN_SLACK_WEBHOOK"

workflows:
  version: 2
  build-test:
    when:
      not: << pipeline.parameters.weekly-security-scan >>
    jobs:
      - build-test
      - publish-image:
          context: web-quay-publish
          requires:
            - build-test
          filters:
            branches:
              ignore: /^dependabot\/.*/
            tags:
              ignore: /.*/
  weekly-security-scan:
    when: << pipeline.parameters.weekly-security-scan >>
    jobs:
      - security-scan:
          context: web-slack-security-scan
